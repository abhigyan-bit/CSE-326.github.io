<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Vendor Login | LocalVibe
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="vendor-entry">
        <input type="checkbox" id="theme-toggle" class="theme-checkbox">
        <label for="theme-toggle" class="theme-button">☾ Dark / ☀ Light</label>
        <main class="auth-card">
            <a class="brand-lockup" href="index.html" aria-label="LocalVibe home"><svg class="brand-bag" viewBox="0 0 64 64" role="img" aria-label="LocalVibe shopping bag logo"><path d="M17 20h30l4 35H13l4-35Z" fill="#7132c8"/><path d="M23 22v-7a9 9 0 0 1 18 0v7" fill="none" stroke="#7132c8" stroke-width="5" stroke-linecap="round"/><path d="M32 44s-11-6.7-11-13.2a6.2 6.2 0 0 1 11-3.9 6.2 6.2 0 0 1 11 3.9C43 37.3 32 44 32 44Z" fill="#fff"/></svg><span class="brand-name">Local<span>Vibe</span></span></a>
            <p class="eyebrow">
                VENDOR PORTAL
            </p>
            <h1>
                Welcome back!
            </h1>
            <p class="muted">
                Login to manage your store and products.
            </p>
            <form id="loginForm">
                <label for="email">
                    Email Address
                </label>
                <input id="email" name="email" type="email" placeholder="vendor@example.com" required>
                <label for="password">
                    Password
                </label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required><button class="btn full" type="submit">Login to Dashboard</button>
            </form>
            <p class="auth-bottom">
                New to LocalVibe? <a href="vendor-signup.html">Create a vendor account</a>
            </p>
            <a class="back-link" href="index.html">← Back to Home</a>
            <p class="demo-note">
                College project demo: login checks the details saved in this browser only.
            </p>
        </main>
        <script src="auth.js"></script>
            <script src="theme.js"></script>
    </body>
</html>
