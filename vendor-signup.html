<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vendor Registration | LocalVibe</title><link rel="stylesheet" href="style.css"></head>
<body class="vendor-entry"><main class="auth-card signup-card"><a class="logo" href="index.html">♥ Local<span>Vibe</span></a><p class="eyebrow">JOIN OUR MARKETPLACE</p><h1>Register your store</h1><p class="muted">Enter your details to get started on LocalVibe.</p><form action="vendor-dashboard.html" method="get"><div class="two"><div><label for="owner">Owner Name</label><input id="owner" type="text" placeholder="Your full name" required></div><div><label for="store">Store Name</label><input id="store" type="text" placeholder="Your business name" required></div><div><label for="phone">Phone Number</label><input id="phone" type="tel" placeholder="Mobile number" required></div><div><label for="email">Email Address</label><input id="email" type="email" placeholder="you@example.com" required></div></div><label for="address">Store Address</label><textarea id="address" rows="2" placeholder="Shop address / city" required></textarea><label for="category">Main Business Category</label><select id="category" required><option value="">Select category</option><option>Clothing & Fashion</option><option>Handmade & Crafts</option><option>Food & Grocery</option><option>Home & Decor</option><option>Beauty & Personal Care</option><option>Electronics & Accessories</option><option>Other</option></select><label for="pass">Create Password</label><input id="pass" type="password" placeholder="Create a password" required><button class="btn full" type="submit">Create Vendor Account</button></form><p class="auth-bottom">Already registered? <a href="vendor-login.html">Login here</a></p><a class="back-link" href="index.html">← Back to Home</a><p class="demo-note">Frontend demo: registration details are not stored in a database.</p></main></body></html>
