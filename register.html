<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Login and Register | LocalVibe
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="wrap nav">
                <a class="logo" href="index.html">♥ Local<span>Vibe</span></a>
                <nav>
                    <a href="index.html">Home</a><a href="shop.html">Shop</a><a href="vendor-dashboard.html">Vendors</a><a href="tracking.html">Track Order</a><a href="admin-dashboard.html">Admin</a>
                </nav>
                <a class="btn outline" href="register.html">Login / Sign Up</a>
            </div>
        </header>
        <section class="title">
            <div class="wrap">
                <h1>
                    Welcome to LocalVibe
                </h1>
                <p class="muted">
                    Sign in or create an account.
                </p>
            </div>
        </section>
        <main class="wrap section two">
            <form class="form">
                <h2>
                    Customer Login
                </h2>
                <label>
                    Email Address
                </label>
                <input type="email" placeholder="you@example.com">
                <label>
                    Password
                </label>
                <input type="password" placeholder="Enter password"><button class="btn" type="button">Login</button>
                <p class="muted">
                    Demo form. No account system is connected.
                </p>
            </form>
            <form class="form">
                <h2>
                    Create Account
                </h2>
                <label>
                    Full Name
                </label>
                <input placeholder="Your name">
                <label>
                    Email Address
                </label>
                <input type="email" placeholder="you@example.com">
                <label>
                    Phone Number
                </label>
                <input type="tel" placeholder="Your phone number">
                <label>
                    Password
                </label>
                <input type="password" placeholder="Create password"><button class="btn" type="button">Create Account</button>
            </form>
        </main>
        <footer>
            <div class="wrap foot">
                <b>♥ LocalVibe</b>
                <div>
                    <a href="index.html">Home</a><a href="shop.html">Shop</a><a href="vendor-dashboard.html">Vendors</a><a href="register.html">Contact</a>
                </div>
                <small>© 2026 LocalVibe · Shop Local. Support Local.</small>
            </div>
        </footer>
    </body>
</html>
